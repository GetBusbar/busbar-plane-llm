# busbar-plane-llm: the LLM plane. Its door (`plane_door::door`) over the six dialect codecs (the
# `codec` module); the cdylib twin `busbar-plane-llm-plugin` exports the same door.
[package]
name = "busbar-plane-llm"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The LLM plane for busbar: the plugin contract's plane kind over its six dialect codecs."
# `build.rs` states this crate's root cells (`tests/root/mod.rs`) and driver proofs
# (`tests/on_driver`) under this `links` name, read by the composition root as
# `DEP_BUSBAR_DOOR_CELLS_<CRATE>_CELLS` / `_DRIVER`. Links no native library.
links = "busbar-door-cells-busbar-plane-llm"

[lints]
workspace = true

[lib]
name = "busbar_plane_llm"
path = "src/lib.rs"

[dependencies]
busbar-contract = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The codecs' serializer: byte identity depends on one serializer for escaping and numbers.
sonic-rs = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The contract's test-only `TestKernelSeal`.
busbar-contract = { workspace = true, features = ["test-seal"] }
serde_json = { workspace = true }
getrandom = { workspace = true }
