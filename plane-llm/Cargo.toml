# busbar-plane-llm: the LLM plane. Its door (`plane_door::door`) over the six dialect codecs (the
# `codec` module); the cdylib twin `busbar-plane-llm-plugin` exports the same door.
[package]
name = "busbar-plane-llm"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The LLM plane for busbar: the plugin contract's plane kind over its six dialect codecs."
# `build.rs` states this crate's root cells (`tests/root/mod.rs`) and driver proofs
# (`tests/on_driver`) under this `links` name, read by the composition root as
# `DEP_BUSBAR_DOOR_CELLS_<CRATE>_CELLS` / `_DRIVER`. Links no native library.
links = "busbar-door-cells-busbar-plane-llm"

[lints]
workspace = true

[lib]
name = "busbar_plane_llm"
path = "src/lib.rs"

[dependencies]
busbar-contract = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
bytes = { workspace = true }
# The event-stream frame checksum (CRC-32/ISO-HDLC) and the synthesized-id hex codec.
crc32fast = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
busbar-kernel = { workspace = true }
# Refusal fixtures retain their independent normalization oracle.
sonic-rs = { workspace = true }
jsonschema = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
getrandom = { workspace = true }
busbar-contract = { workspace = true, features = ["test-seal"] }
busbar-plugin-loader = { workspace = true, features = ["test-support"] }

[package.metadata.busbar.test-contexts]
inbound = [{ path = "tests/root_context/inbound.rs" }]
