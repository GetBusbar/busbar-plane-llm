# RENDERED by `busbar-release plugin sync busbar-plane-llm` from GetBusbar/busbar-release template/; a hand
# edit is overwritten by the next sync. THIS REPO TESTS ITSELF AGAINST BUSBAR with the fleet's ONE
# harness: busbar-release's ci/plugin/run.sh (the same scripts its reusable plugin-ci.yml runs),
# taken at the busbar-release commit below, against the busbar commit in .busbar-ref. busbar-release
# is private and this repo is public, so a `uses:` call cannot reach it; these jobs only check the
# two repos out and run the harness, as busbar's own promote.yml does. No CI logic lives here.
name: ci

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch: {}
  # release.yml runs this file on the tagged commit before it publishes.
  workflow_call: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_REF: a5c0dbd55cfc2fc57485a51e2c595a4fc1bf1d1c
  POLICY_REF: fd8a207bb97a2ded5e401a41bd7e49d62db111bd
  REGISTRY_REF: fd8a207bb97a2ded5e401a41bd7e49d62db111bd
  PLUGIN_REPO: busbar-plane-llm
  PLUGIN_KIND: plane
  PLUGIN_ALIAS: llm
  PLUGIN_CRATE: busbar-plane-llm-plugin
  PLUGIN_SERVICE: none
  PLUGIN_BUSBAR_CHECKOUT: false
  PLUGIN_MACOS_TEST: "cargo test --workspace --locked"
  PLUGIN_EXTRA_TEST: ""
  PLUGIN_LIB_ONLY: false

jobs:
  linux:
    name: plugin-ci [linux]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: plugin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: GetBusbar/busbar-release
          ref: ${{ env.RELEASE_REF }}
          token: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          path: busbar-release
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: plugin
      - run: bash busbar-release/ci/plugin/run.sh linux
  macos:
    name: plugin-ci [macos]
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: plugin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: GetBusbar/busbar-release
          ref: ${{ env.RELEASE_REF }}
          token: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          path: busbar-release
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: plugin
      - run: bash busbar-release/ci/plugin/run.sh macos
